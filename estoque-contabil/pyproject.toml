[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-contabil"
version = "0.1.0"
description = "Plataforma local para automação e análise contábil"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=20,<22",
  "pyxlsb>=1.0.10,<2",
  "pywin32>=311; sys_platform == 'win32'",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=12,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
ops-contabil = "ops_contabil.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ops_contabil = ["web/templates/*.html", "extractors/*.vbs", "knowledge/*.md", "knowledge/documentacao/*", "assets/*.png", "assets/*.ico", "assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
