// Normaliza texto (sem acento, minúsculo)
function politicaNormalize(str) {
  if (!str) return "";
  return str
    .toString()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

// Encontra categoria com base no texto da pergunta
function detectarCategoriaPoliticaEmTexto(norm) {
  if (!norm) return null;
  const texto = politicaNormalize(norm);

  for (const cat of POLITICA_CATEGORIAS) {
    if (!cat.gatilhos || !cat.gatilhos.length) continue;
    for (const gatilho of cat.gatilhos) {
      if (texto.includes(gatilho)) {
        return cat;
      }
    }
  }
  return null;
}

// Avalia categoria → monta mensagem estruturada
function avaliarCategoriaPolitica(categoriaId) {
  const cat = POLITICA_CATEGORIAS.find(c => c.id === categoriaId);
  if (!cat) {
    return {
      status: "desconhecida",
      mensagemUsuario:
        `<div class="text-sm text-slate-700">
           <p>Não encontrei essa categoria na política dos cartões Clara.</p>
           <p class="mt-2">Se for um caso específico, recomendo falar com o financeiro ou abrir chamado.</p>
         </div>`
    };
  }

  let corpo = "";
  if (cat.status === "liberada") {
    corpo =
      `Essa categoria está ✅ <b>liberada</b> para uso operacional, desde que:
       <ul class="list-disc ml-4 mt-1">
         <li>seja despesa necessária à operação da loja;</li>
         <li>seja lançada com etiqueta correta e comprovante fiscal;</li>
         <li>respeite limites e demais regras da política.</li>
       </ul>`;
  } else if (cat.status === "somente_com_autorizacao") {
    corpo =
      `Essa categoria ⚠️ <b>não deve ser usada diretamente</b> no cartão da loja. Em regra, exige <b>análise e autorização prévia</b> do financeiro antes de qualquer uso.`;
  } else if (cat.status === "proibida") {
    corpo =
      `Essa categoria é ❌ <b>proibida</b> para uso no cartão Clara das lojas. Não se enquadra como despesa operacional permitida.`;
  } else {
    corpo =
      `Essa categoria não está claramente classificada na política. Recomendo validar com o financeiro.`;
  }

  const ref = cat.referenciaPolitica || "itens 6 e 9 da política";

  const mensagemUsuario =
    `<div class="text-sm text-slate-700">
       <p><b>Categoria analisada:</b> ${cat.nomePolitica}</p>
       <p class="mt-2">${corpo}</p>
       <p class="mt-2">${cat.observacoes || ""}</p>
       <p class="mt-2 text-xs text-slate-500">
         Resumo baseado na Política de Uso dos Cartões Clara (${ref}). Em caso de dúvida ou exceção, abra chamado no ServiceNow.
       </p>
     </div>`;

  return {
    status: cat.status,
    mensagemUsuario
  };
}

// ================= RESUMO GERAL DE CATEGORIAS =================

function gerarResumoCategoriasPolitica() {
  const liberadas = POLITICA_CATEGORIAS
    .filter(c => c.status === "liberada")
    .map(c => c.nomePolitica);

  const condicionais = POLITICA_CATEGORIAS
    .filter(c => c.status === "somente_com_autorizacao")
    .map(c => c.nomePolitica);

  const proibidas = POLITICA_CATEGORIAS
    .filter(c => c.status === "proibida")
    .map(c => c.nomePolitica);

  const lista = arr =>
    arr.length
      ? "<ul class='list-disc ml-4 mt-1'>" +
        arr.map(nome => "<li>" + nome + "</li>").join("") +
        "</ul>"
      : "<p class='text-xs text-slate-500'>Nenhuma categoria cadastrada nesse grupo.</p>";

  const mensagemUsuario =
    `<div class="text-sm text-slate-700">
       <p>Visão geral das categorias na política dos cartões Clara

       <p class="mt-2"><b>Categorias liberadas para uso operacional (com bom senso e etiqueta correta):</b></p>
       ${lista(liberadas)}

       <p class="mt-3"><b>Categorias que exigem análise e autorização prévia do financeiro:</b></p>
       ${lista(condicionais)}

       <p class="mt-3"><b>Categorias proibidas para uso no cartão Clara das lojas:</b></p>
       ${lista(proibidas)}

       <p class="mt-3 text-xs text-slate-500">
         Resumo baseado na Política de Uso dos Cartões Clara (itens 6 e 9). Em caso de dúvida ou exceção, abra chamado no ServiceNow ou consulte o financeiro.
       </p>
     </div>`;

  return {
    status: "resumo",
    mensagemUsuario
  };
}

// Detecta se a pergunta é “quais categorias posso usar?” etc.
function tentarResponderResumoCategoriasPolitica(norm) {
  const texto = politicaNormalize(norm || "");

  const gatilhosResumo = [
    "quais categorias",
    "categorias liberadas",
    "categorias permitidas",
    "categorias autorizadas",
    "categorias bloqueadas",
    "categorias proibidas",
    "categorias da politica",
    "categorias da política",
    "categorias do cartao",
    "categorias do cartão"
  ];

  const bate = gatilhosResumo.some(g => texto.includes(g));
  if (!bate) return null;

  return gerarResumoCategoriasPolitica();
}

// Função de alto nível usada pelo gerarRespostaPolitica
function tentarResponderPorCategoriaPolitica(msgOriginal, norm) {
  const cat = detectarCategoriaPoliticaEmTexto(norm || msgOriginal || "");
  if (!cat) return null;

  const resultado = avaliarCategoriaPolitica(cat.id);
  return resultado;
}

function vektorPolicyDadosResponderCompraDireta_(msgOriginal) {
  const texto = politicaNormalize(msgOriginal || "");
  if (!texto) return null;

  const termosCompra = [
    "posso comprar",
    "pode comprar",
    "consigo comprar",
    "devo comprar",
    "comprar com o cartao",
    "comprar com o cartão",
    "usar o cartao",
    "usar o cartão",
    "passar no cartao",
    "passar no cartão"
  ];

  const parecePerguntaCompra = termosCompra.some(function(t) {
    return texto.includes(t);
  });

  if (!parecePerguntaCompra) return null;

  const cat = detectarCategoriaPoliticaEmTexto(texto);
  if (!cat) return null;

  let decisaoHtml = "";

  if (cat.status === "proibida") {
    decisaoHtml =
      `<p><b>Não. Não compre esse item com o Cartão Clara da loja.</b></p>
       <p class="mt-2">
         O item citado se enquadra na categoria <b>${cat.nomePolitica}</b>, que não deve ser tratada como despesa operacional comum do cartão.
       </p>
       <p class="mt-2">
         Para esse tipo de compra, o fluxo correto é acionar o processo formal de compras/financeiro, e não realizar a transação diretamente no cartão da loja.
       </p>`;
  } else if (cat.status === "somente_com_autorizacao") {
    decisaoHtml =
      `<p><b>Não realize a compra diretamente no Cartão Clara sem autorização formal prévia.</b></p>
       <p class="mt-2">
         O item citado se enquadra na categoria <b>${cat.nomePolitica}</b>, que exige validação do financeiro antes de qualquer uso.
       </p>
       <p class="mt-2">
         Antes de seguir, abra chamado ou valide formalmente com o financeiro.
       </p>`;
  } else if (cat.status === "liberada") {
    decisaoHtml =
      `<p><b>Em princípio, essa categoria pode ser usada no Cartão Clara, desde que seja uma despesa operacional da loja.</b></p>
       <p class="mt-2">
         A categoria identificada foi <b>${cat.nomePolitica}</b>.
       </p>
       <ul class="list-disc ml-4 mt-2">
         <li>Use a etiqueta correta;</li>
         <li>Anexe comprovante fiscal válido;</li>
         <li>Respeite limites e regras da política;</li>
         <li>Não utilize para benefício pessoal.</li>
       </ul>`;
  } else {
    return null;
  }

  const html =
    `<div class="text-sm text-slate-700">
      ${decisaoHtml}

      <p class="mt-3"><b>Base da análise:</b></p>
      <ul class="list-disc ml-4 mt-1">
        <li>Categoria identificada: <b>${cat.nomePolitica}</b>;</li>
        <li>Referência: <b>${cat.referenciaPolitica || "Política de Uso dos Cartões Clara"}</b>;</li>
        <li>Observação da política: ${cat.observacoes || "Sem observação complementar."}</li>
      </ul>

      <p class="mt-3 text-xs text-slate-500">
        AI generated | gemini-2.5-flash
      </p>
    </div>`;

  return "HTML:" + html;
}
